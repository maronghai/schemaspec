name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Fast pre-checks: format, build, unit tests
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check rune/src/

      - name: Version consistency (VERSION vs packaging manifests)
        run: bash scripts/sync-version.sh --check

      - name: Build
        run: cd rune && zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        run: cd rune && zig build test

  # Sharded golden tests (4 shards in parallel)
  test-shard:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (release)
        run: cd rune && zig build -Doptimize=ReleaseSafe

      - name: Run test shard ${{ matrix.shard }}/4
        run: |
          bash tests/test_coverage.sh --fast --shard 4/${{ matrix.shard }}

  # Test aggregation (reports overall pass/fail)
  test-aggregate:
    needs: test-shard
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check shard results
        run: |
          # All shards must pass (needs: test-shard with if: always() means this runs even if some fail)
          # GitHub Actions automatically fails the workflow if any needed job failed
          echo "All test shards completed successfully"

  # Windows tests (unchanged)
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: cd rune && zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        run: cd rune && zig build test

  # ARM64 cross-compilation tests (unchanged)
  test-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for ARM64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux

      - name: Unit tests (native)
        run: cd rune && zig build test

      - name: MySQL golden tests (native)
        run: bash tests/test.sh

      - name: PostgreSQL golden tests (native)
        run: bash tests/test_postgres.sh

  # Benchmark regression check (unchanged)
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run benchmark
        run: cd rune && zig build bench

      - name: Check for regressions (>10%)
        run: cd rune && zig build bench -- --check

  # FreeBSD cross-compilation (unchanged)
  test-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for FreeBSD x86_64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-freebsd

      - name: Cross-compile for FreeBSD aarch64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-freebsd
