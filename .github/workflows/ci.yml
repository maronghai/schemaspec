name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Check formatting
        run: zig fmt --check rune/src/

      - name: Build
        run: cd rune && zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        run: cd rune && zig build test

      - name: Golden tests (MySQL)
        run: bash tests/test.sh

      - name: Golden tests (PostgreSQL)
        run: bash tests/test_postgres.sh

      - name: Golden tests (SQLite)
        run: bash tests/test_sqlite.sh

      - name: Golden tests (MSSQL)
        run: bash tests/test_mssql.sh

      - name: Golden tests (Oracle)
        run: bash tests/test_oracle.sh

      - name: Golden tests (Db2)
        run: bash tests/test_db2.sh

      - name: Migration tests
        run: bash tests/test_migrate.sh && bash tests/test_migrate_status.sh

      - name: Reverse engineering tests
        run: bash tests/test_reverse.sh && bash tests/test_reverse_oracle.sh && bash tests/test_reverse_db2.sh

      - name: Diff & recovery tests
        run: bash tests/test_diff.sh && bash tests/test_error_recovery.sh

      - name: Schema tests
        run: bash tests/test_json_schema.sh && bash tests/test_roundtrip.sh

      - name: Pipeline tests
        run: bash tests/test_imports.sh && bash tests/test_stdin.sh && bash tests/test_init.sh && bash tests/test_color.sh && bash tests/test_validate.sh && bash tests/test_stats_json.sh

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: cd rune && zig build -Doptimize=ReleaseSafe

      - name: Unit tests
        run: cd rune && zig build test

  test-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for ARM64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-linux

      - name: Unit tests (native)
        run: cd rune && zig build test

      - name: MySQL golden tests (native)
        run: bash tests/test.sh

      - name: PostgreSQL golden tests (native)
        run: bash tests/test_postgres.sh

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run benchmark
        run: cd rune && zig build bench

      - name: Check for regressions (>10%)
        run: cd rune && zig build bench -- --check

  test-freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for FreeBSD x86_64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=x86_64-freebsd

      - name: Cross-compile for FreeBSD aarch64
        run: cd rune && zig build -Doptimize=ReleaseSafe -Dtarget=aarch64-freebsd
