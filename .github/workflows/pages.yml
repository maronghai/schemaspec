name: Playground Pages

# Deploys the browser playground (editor + rune.wasm) to GitHub Pages.
# The deployment tree preserves the repo-relative layout the page expects
# (playground/index.html imports ../rune/wasm/rune.js which fetches
# ../rune/zig-out/bin/rune.wasm), so no source changes are needed.
# Enable once per repo: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - 'rune/wasm/**'
      - 'rune/src/wasm.zig'
      - 'rune/src/wasm/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig
        uses: step-security/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build rune.wasm
        run: cd rune && zig build -Dtarget=wasm32-wasi

      - name: Assemble deployment tree
        run: |
          mkdir -p _pages/playground _pages/rune/wasm _pages/rune/zig-out/bin
          cp playground/index.html _pages/playground/
          cp rune/wasm/rune.js _pages/rune/wasm/
          cp rune/zig-out/bin/rune.wasm _pages/rune/zig-out/bin/
          touch _pages/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
